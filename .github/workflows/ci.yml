name: CI

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

  build-windows:
    name: Portable Windows build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !github.event.deleted
    needs: [quality]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Build portable executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Tourney-windows-x64
          path: dist/Tourney.exe
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:GITHUB_REF_NAME" dist/Tourney.exe --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create "$env:GITHUB_REF_NAME" dist/Tourney.exe --repo "$env:GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Tourney $env:GITHUB_REF_NAME"
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release publication failed.'
          }
