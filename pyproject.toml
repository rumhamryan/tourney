[project]
name = "tourney"
version = "0.1.30"
description = "Program to run brackets or a chipe tournament."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pyyaml",
    "pyside6>=6.11.2",
    "ortools>=9.15.6755",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov>=7.0.0",
    "pytest-mock",
    "pytest-xdist>=3.8.0",
    "ruff",
    "pre-commit",
    "types-requests",
    "types-PyYAML",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3,<7",
]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.4.2",
    "pre-commit>=3.7.0",
    "types-requests",
    "types-PyYAML",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Start from a known baseline; adjust based on your existing config.
select = [
  "E", "F",         # pycodestyle + pyflakes
  "B",              # bugbear
  "I",              # import sorting
  "UP",             # pyupgrade
  "SIM",            # simplify
  "PLR",            # pylint refactor rules (god-function controls live here)
]

[tool.ruff.lint.pylint]
# Tune these to your “minimum bar”
max-statements = 30
max-branches = 10
max-locals = 12
max-nested-blocks = 4
max-args = 6
max-positional-args = 4
max-bool-expr = 4

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=src -n 4 --dist=worksteal"
testpaths = [
    "tests",
]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
# Python 3.12's monitoring API avoids tracing already-covered lines repeatedly.
core = "sysmon"
